name: Test
on:
  - push
  - pull_request
jobs:
  full-ubuntu:
    name: Full_Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: sudo apt update
      - run: sudo apt install libmodule-build-perl libclass-accessor-perl libtext-hyphen
      - run: perl ./Build.PL
      - run: ./Build test
