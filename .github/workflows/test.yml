name: Test
on:
  - push
  - pull_request
jobs:
  full-ubuntu:
    name: Full_Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - run: sudo apt update
      - run: sudo apt install libmodule-build-perl libclass-accessor-perl
      - name: Install Perl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cpanminus
          sudo cpanm Text::Hyphen
      - run: perl ./Build.PL
      - run: ./Build test
